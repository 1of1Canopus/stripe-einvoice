spring:
  application:
    name: stripe-einvoice-sample
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://localhost:5432/einvoice}
    username: ${JDBC_USERNAME:einvoice}
    password: ${JDBC_PASSWORD:einvoice}
  security:
    user:
      name: ${SAMPLE_USER:sample}
      password: ${SAMPLE_PASSWORD:sample}

einvoice:
  # live by default, exactly as the library's default: a sample that quietly ran in test mode would
  # teach the wrong habit. Point it at a throwaway database.
  mode: live
  seller:
    id: acme-fr
    # Required, no default: BT-2 is derived in this zone, and an invoice finalised at 23:30 UTC
    # belongs to the day its tax authority says it does.
    tax-zone: Europe/Paris
    # The issuing party as it appears on the document. Every identifier below is checked at
    # startup, check digit included: a mistyped VAT id here is a rejection at the recipient.
    # Obviously synthetic: the SIREN is in the 9xx range and carries a real Luhn key.
    name: Atelier Riviere SAS
    vat-id: FR25900000019
    legal-id: "900000019"
    legal-id-scheme: "0002"          # ISO 6523 ICD: the French SIRENE register
    electronic-address: FR25900000019
    electronic-address-scheme: "9957" # Peppol EAS: a French VAT identifier
    address:
      line1: 12 rue des Lilas
      city: Lyon
      postal-code: "69003"
      country: FR
    contact:
      name: Comptabilite
      telephone: "+33 4 72 00 00 00"
      email: factures@atelier-riviere.invalid
    payment:
      means-code: "58"               # UNTDID 4461: SEPA credit transfer
      account-id: FR7630006000011234567890189
      account-name: Atelier Riviere SAS
  documents:
    # peppol-bis-ubl or xrechnung-ubl. One profile per application, so one legal document per
    # invoice - which is what the issuance unit of work archives.
    profile: peppol-bis-ubl
    # BT-10. Mandatory for XRechnung (BR-DE-15); for a German public-sector buyer it is the
    # Leitweg-ID the authority issued. It never comes from Stripe metadata or a buyer field.
    buyer-reference: BON-DE-COMMANDE-9912
    # The EN 16931 schematron is XSLT 2.0 and the JDK ships XSLT 1.0 only. The processor ships with
    # the module (a runtime dependency of the core), and this property is how another one is
    # substituted. Without any, nothing is issued: an unevaluated rule is not a passed rule.
    xslt-processor: net.sf.saxon.TransformerFactoryImpl
  numbering:
    series: DEFAULT
    prefix: "INV-{fiscalYear}-"
    width: 6
  chain:
    # Environment only. head -c 32 /dev/urandom | base64
    hmac-secret: ${EINVOICE_CHAIN_SECRET}
    hmac-key-id: k1
  issuance:
    # The sample as shipped is the numbering and rendering demo: it allocates legal numbers and
    # serves the series report, and it has NO Stripe intake - no webhook secret, no API key, no
    # sweeper. Saying so explicitly is what makes it a documented state rather than an accident:
    # the starter's intake wiring check then logs "numbering API only, as configured" at startup
    # instead of warning at every boot, and the check stays strict for the state that matters,
    # which is a host configured to receive events with a piece missing.
    #
    # Intake, with a real Stripe account, is one profile away: see application-intake.yml and
    # "Run the sample" in the README. Nothing here weakens that check - it turns intake OFF.
    enabled: false
  archive:
    # The legal originals. A directory here, an S3-compatible bucket in production.
    type: filesystem
    root: ${EINVOICE_ARCHIVE_ROOT:./target/einvoice-archive}

logging:
  level:
    com.housedevinci.einvoice: INFO
